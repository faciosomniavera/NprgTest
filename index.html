<body class = "bg-light">
<header>
<div class = "container d-flex justify-content-between align-items-center py-3">
    <a>ARCHITECTURE QUIZ</a>
    <a>ABOUT</a>
</div>
</header>

<div class = "mx-auto" style="width: fit-content;">
    <h1>FIND<br>YOUR<br>ARCHITECTURE</h1>
</div>
<main class = "container mt-5">
<!--　質問1 -->
<section id="question1" class="container text-center mt-5">
    <p class="text-muted small">QUESTION 01</p>
    <h3>どちらの空間に惹かれますか？</h3>
    <div class="d-flex justify-content-center gap-3 mt-4">
        <button class="btn btn-dark px-4 py-3">
            無機質で静かな空間
        </button>
        <button class="btn btn-outline-dark px-4 py-3">
            自然で温かみのある空間
        </button>
    </div>
</section>
<!-- 2 -->
<section id="question2" class="container text-center mt-5" style="display: none;">
    <p class="text-muted small">QUESTION 02</p>
    <h3>どちらの素材が好きですか？</h3>
    <div class="d-flex justify-content-center gap-3 mt-4">
        <button class="btn btn-dark px-4 py-3">
            コンクリートや金属
        </button>
        <button class="btn btn-outline-dark px-4 py-3">
            木や石などの自然素材
        </button>
    </div>
</section>
<!-- 3 -->
<section id="question3" class="container text-center mt-5" style="display: none;">

        </button>
        <button class="btn btn-outline-dark px-4 py-3">

        </button>
    </div>
</section>
