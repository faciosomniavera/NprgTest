<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha256-fx038NkLY4U1TCrBDiu5FWPEa9eiZu01EiLryshJbCo=" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<title>Find Architecture</title>
</head>

<body class = "bg-light">
<header>
<div class = "container d-flex justify-content-between align-items-center py-3">
    <span>ARCHITECTURE QUIZ</span>
    <span>Let's Try</span>
</div>
</header>

<div class = "mx-auto" style="width: fit-content;">
    <h1>FIND<br>YOUR<br>ARCHITECTURE</h1>
</div>
<main class = "container mt-5">
	
<!-- 1 -->
<section id="question1" class="container text-center mt-5">
    <p class="text-muted small">QUESTION 01</p>
    <h3>どちらの空間に惹かれますか？</h3>
    <div class="d-flex justify-content-center gap-3 mt-4">
        <button class="btn btn-dark">
            無機質で静かな空間
        </button>
        <button class="btn btn-outline-dark">
            自然で温かみのある空間
        </button>
    </div>
</section>

<!-- 2 -->
<section id="question2" class="container text-center mt-5" style="display: none;">
    <p class="text-muted small">QUESTION 02</p>
    <h3>どちらの建築が好きですか？</h3>
    <div class="d-flex justify-content-center gap-3 mt-4">
        <button class="btn btn-dark">
            直線的で幾何学的な建築
        </button>
        <button class="btn btn-outline-dark">
            曲線的で有機的な建築
        </button>
    </div>
</section>

<!--結果発表-->
<section id="result" class="container text-center mt-5" style="display: none;">
    <p class="text-muted small">YOUR RESULT</p>
    <h2 id="resultTitle"></h2>
    <p id="resultDescription"></p>
</section>
</main>
	<script src="script.js"></script>
</body>
</html>
